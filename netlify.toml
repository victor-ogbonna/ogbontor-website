# Static site — nothing to build, just publish the repo root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS and JS carry a content hash in the URL, so they can be cached hard.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Link-preview crawlers (WhatsApp, X, Facebook) must always see the current card.
[[headers]]
  for = "/assets/img/og-image.*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/register.html"
  to = "/register"
  status = 301
  force = false
