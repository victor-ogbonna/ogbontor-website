<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img"
     aria-label="Map of Africa rendered as a circuit board, with the lab at UNN Nsukka in Nigeria marked">
  <defs>
    <linearGradient id="af-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CBAFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2E7BF6" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="af-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE1FF"/><stop offset="1" stop-color="#5C9BFF"/>
    </linearGradient>
    <radialGradient id="af-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35C7E4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#35C7E4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="af-clip"><path d="M72 62 L150 42 L232 38 L278 52 L300 92 L322 128 L352 150 L392 170 L344 196 L320 232 L306 276 L292 320 L268 360 L244 396 L212 428 L186 404 L176 366 L164 320 L150 276 L140 244 L118 234 L92 228 L62 214 L34 186 L22 150 L38 120 L52 92 Z"/></clipPath>
  </defs>

  <g clip-path="url(#af-clip)">
    <rect width="420" height="460" fill="url(#af-fill)"/>
    <g stroke="#CFE1FF" stroke-opacity=".5" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M40 120 H120 V72 H220 V120 H300"/>
      <path d="M60 170 H130 V214 H196 V160 H286 V214 H340"/>
      <path d="M126 226 H210 V286 H286"/>
      <path d="M170 300 H240 V352 H206 V410"/>
      <path d="M96 96 V150 M250 60 V110 M312 150 V196 M226 250 V310"/>
    </g>
    <g fill="#9CC4FF" fill-opacity=".9">
      <circle cx="120" cy="72" r="3.6"/><circle cx="220" cy="120" r="3.6"/><circle cx="130" cy="214" r="3.6"/>
      <circle cx="196" cy="160" r="3.6"/><circle cx="286" cy="214" r="3.6"/><circle cx="210" cy="286" r="3.6"/>
      <circle cx="240" cy="352" r="3.6"/><circle cx="206" cy="410" r="3.6"/><circle cx="312" cy="196" r="3.6"/>
    </g>
  </g>

  <path d="M72 62 L150 42 L232 38 L278 52 L300 92 L322 128 L352 150 L392 170 L344 196 L320 232 L306 276 L292 320 L268 360 L244 396 L212 428 L186 404 L176 366 L164 320 L150 276 L140 244 L118 234 L92 228 L62 214 L34 186 L22 150 L38 120 L52 92 Z" fill="none" stroke="url(#af-edge)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Nigeria: the inner corner of the Gulf of Guinea -->
  <circle cx="126" cy="226" r="44" fill="url(#af-glow)"/>
  <g transform="translate(126 226)">
    <circle r="14" fill="none" stroke="#35C7E4" stroke-width="2" opacity=".6"/>
    <circle r="8" fill="#35C7E4"/>
    <circle r="3.2" fill="#062B55"/>
  </g>
  <path d="M126 226 L246 300" stroke="#35C7E4" stroke-width="1.8" stroke-dasharray="5 6" opacity=".85"/>
  <g transform="translate(246 286)">
    <rect width="150" height="44" rx="10" fill="#062B55" fill-opacity=".8" stroke="#35C7E4" stroke-opacity=".45"/>
    <text x="15" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="9.5" fill="#35C7E4" letter-spacing="1.8">THE LAB</text>
    <text x="15" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
          font-size="13" font-weight="700" fill="#EAF1FB">UNN, Nsukka</text>
  </g>
</svg>
