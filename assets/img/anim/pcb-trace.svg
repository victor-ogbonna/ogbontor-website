<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img"
     aria-label="Circuit traces carrying current into a microcontroller">
  <defs>
    <linearGradient id="pt-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35C7E4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#35C7E4"/>
      <stop offset="1" stop-color="#35C7E4" stop-opacity="0"/>
    </linearGradient>
    <filter id="pt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g stroke="currentColor" stroke-opacity=".22" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M10 60 H120 V130 H210"/>
    <path d="M10 150 H80 V210 H210"/>
    <path d="M10 250 H150 V190 H210"/>
    <path d="M350 130 H430 V60 H550"/>
    <path d="M350 190 H470 V250 H550"/>
    <path d="M350 160 H550"/>
  </g>

  <g fill="currentColor" fill-opacity=".35">
    <circle cx="120" cy="60" r="3.5"/><circle cx="80" cy="150" r="3.5"/>
    <circle cx="150" cy="250" r="3.5"/><circle cx="430" cy="60" r="3.5"/>
    <circle cx="470" cy="250" r="3.5"/>
  </g>

  <!-- current flowing along each trace -->
  <g stroke="url(#pt-flow)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#pt-glow)">
    <path d="M10 60 H120 V130 H210" stroke-dasharray="46 420">
      <animate attributeName="stroke-dashoffset" from="466" to="0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M10 150 H80 V210 H210" stroke-dasharray="46 420">
      <animate attributeName="stroke-dashoffset" from="466" to="0" dur="3.1s" begin="-.7s" repeatCount="indefinite"/>
    </path>
    <path d="M10 250 H150 V190 H210" stroke-dasharray="46 420">
      <animate attributeName="stroke-dashoffset" from="466" to="0" dur="2.9s" begin="-1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M350 160 H550" stroke-dasharray="46 420">
      <animate attributeName="stroke-dashoffset" from="466" to="0" dur="2.4s" begin="-.4s" repeatCount="indefinite"/>
    </path>
    <path d="M350 130 H430 V60 H550" stroke-dasharray="46 420">
      <animate attributeName="stroke-dashoffset" from="466" to="0" dur="3.3s" begin="-1.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- the chip -->
  <g transform="translate(210 100)">
    <rect width="140" height="120" rx="10" fill="currentColor" fill-opacity=".07"
          stroke="currentColor" stroke-opacity=".5" stroke-width="2.5"/>
    <rect x="34" y="30" width="72" height="60" rx="5" fill="currentColor" fill-opacity=".14"
          stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
    <g stroke="currentColor" stroke-opacity=".45" stroke-width="3" stroke-linecap="round">
      <path d="M0 30 h-12M0 60 h-12M0 90 h-12M140 30 h12M140 60 h12M140 90 h12"/>
    </g>
    <circle cx="70" cy="60" r="7" fill="#35C7E4">
      <animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;1;.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
